[Settings]
; 키보드 유선 분리(모바일 전환) 시 작업표시줄 상단 LED 바 색상 (기본: 네온 레드 #FF2D55)
; 지원 색상 예시: #FF2D55(레드), #FF9500(오렌지), #FFCC00(앰버), #FF375F(핑크), #007AFF(블루)
DisconnectedColor=#FF2D55

; 키보드 유선 연결(PC 활성) 시 LED 바 색상 (기본: 네온 그린 #32D74B)
ConnectedColor=#32D74B

; 유선 연결 시에도 LED 바를 표시할지 여부 (0: 평상시 작업표시줄 유지[기본], 1: 항상 표시)
ShowWhenConnected=0

; LED 바 두께 (픽셀 단위, 기본: 3, 권장: 2~4)
BarThickness=3

; 자동 감지 모드 (1: 외장 USB/HID 키보드 자동 감지[기본], 0: 특정 VID/PID만 감시)
AutoDetect=1

; 특정 키보드만 감시하려면 아래에 대문자 4자리 16진수 입력 (예: TargetVid=05AC, TargetPid=024F)
TargetVid=
TargetPid=
TargetDeviceName=
